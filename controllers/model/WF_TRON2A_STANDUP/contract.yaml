- 'Wheels: kp = kd = 0 and feed-forward tau = clip(a)*8 N.m (cap 16), free rolling
  at a = 0 as in training.'
- 'Deploy safety additions (not training values): start within start_tolerance of
  A''/A''_p per leg, settle_seconds dwell at A'' after the seated route, torque pre-clip
  at the stand-up fraction, stand-up tilt latch, episode_seconds timeout latch.'
- 'Success needs the root height: estimated by FK+IMU above the lowest wheel point,
  only while both wheels are within wheel_level_tolerance and every other link/base
  point is body_clearance above them (flat ground).'
