alignment_notes:
- Power-on 3.0 seconds and gain ramp 0.2 to 1.0 are deployment safety requirements,
  not training values.
- Vendor publish rate retained; inference period follows training sim.dt * decimation.
- Wheel torque/velocity limits use training actuators; leg torque limits retain vendor
  values.
- Target position bounds shrink URDF ranges about their midpoint by the training soft-limit
  factor; actor/history are unchanged.
- Training observation noise and action latency randomization are not injected on
  hardware.
- Commands are physical vx, vy, wz; generated_commands returns them unchanged. Sampling
  ranges are not observation clipping.
- IMU-to-base rotation remains UNVERIFIED until hardware calibration.
